<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tabpus v2 — Test Runner</title>
  <style>
    body { font-family: -apple-system, sans-serif; padding: 24px; background: #fafaf7; }
    h1 { margin: 0 0 16px; }
    #results { white-space: pre-wrap; font-family: Menlo, monospace; font-size: 13px; line-height: 1.6; }
    .pass { color: #2a7a2a; }
    .fail { color: #c42a2a; }
    .info { color: #6b6b6b; }
  </style>
</head>
<body>
  <h1>Tabpus v2 — Test Runner</h1>
  <p class="info">
    推荐打开方式：在 chrome://extensions 里点"检查视图 tests/runTests.html"，<br />
    或直接访问 chrome-extension://&lt;id&gt;/tests/runTests.html。<br />
    也可在普通网页环境打开本文件（mockChrome.js 会注入最小 storage mock）。
  </p>
  <div id="results" class="info">Loading tests…</div>

  <script type="module">
    // Mock chrome.* (must import first; side-effect)
    import './mockChrome.js';
    import { run } from './testUtil.js';
    import './timeTracker.test.js';
    import './formatDuration.test.js';
    import './sidebar.test.js';

    const resultsEl = document.getElementById('results');
    resultsEl.classList.remove('info');
    run(resultsEl).then(({ pass, fail }) => {
      console.log(`[tempus test] ${pass} passed, ${fail} failed`);
    });
  </script>
</body>
</html>
