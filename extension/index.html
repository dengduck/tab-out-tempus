<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Tab Out Tempus</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header id="header" class="header">
      <div class="header__left">
        <h1 class="brand">Tab Out Tempus</h1>
        <p class="status">v2.0.0 · 启动中…</p>
      </div>
      <div class="header__right">
        <button id="historyToggle" class="historyToggle" title="统计">📊</button>
        <div class="todayWork" id="todayWork" hidden>
          <span class="todayWork__label">今日工作</span>
          <span class="todayWork__value" id="todayWorkValue">--</span>
          <span class="todayWork__dot" id="todayWorkDot" aria-hidden="true"></span>
        </div>
      </div>
    </header>
    <section id="historyPanel" class="historyPanel" hidden></section>
    <main id="main">
      <section id="tabsGrid" class="tabsGrid"></section>
      <aside id="sidebar" class="sidebar"></aside>
    </main>
  </div>
  <script type="module" src="ui/main.js"></script>
</body>
</html>
