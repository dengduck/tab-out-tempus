<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tabpus · 专注中</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f4ee; color: #24231f; }
    main { width: min(560px, calc(100vw - 40px)); padding: 40px; border: 1px solid #ddd8cb; border-radius: 18px; background: #fffdf8; box-shadow: 0 18px 50px rgb(56 48 33 / 10%); }
    .eyebrow { margin: 0 0 10px; color: #777164; font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0 0 12px; font-size: clamp(28px, 6vw, 42px); line-height: 1.12; }
    p { margin: 0; color: #686257; line-height: 1.7; }
    .actions { display: grid; gap: 10px; margin-top: 30px; }
    button { min-height: 44px; padding: 0 18px; border: 1px solid #cbc4b5; border-radius: 10px; background: #fff; color: inherit; font: inherit; font-weight: 650; cursor: pointer; }
    button:hover { background: #f4f0e7; }
    button.primary { border-color: #24231f; background: #24231f; color: #fff; }
    button.primary:hover { background: #403d36; }
    button:disabled { cursor: wait; opacity: .55; }
    #status { min-height: 24px; margin-top: 16px; color: #8a4b35; font-size: 13px; }
    @media (prefers-color-scheme: dark) {
      :root { color-scheme: dark; }
      body { background: #141311; color: #f7f3eb; }
      main { background: #211f1b; border-color: #4d473f; box-shadow: none; }
      p, .eyebrow { color: #c1b8aa; }
      button { background: #292620; border-color: #5c554b; color: #f7f3eb; }
      button:hover { background: #343029; }
      button.primary { background: #ff9a5c; border-color: #ff9a5c; color: #141311; }
      #status { color: #ff9a5c; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Focus Timer</p>
    <h1>现在是专注时间</h1>
    <p>此页面不在本次专注允许的域名中。你可以返回、结束专注，或仅在本次专注中允许此域名。</p>
    <div class="actions" aria-label="专注操作">
      <button type="button" data-action="return">返回</button>
      <button type="button" data-action="stop">结束专注</button>
      <button type="button" class="primary" data-action="allow">本次允许此域名</button>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script type="module" src="ui/blocked.js"></script>
</body>
</html>
